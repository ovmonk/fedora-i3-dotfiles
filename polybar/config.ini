; ====================================================================
; One Dark 风格颜色定义
; ====================================================================
[colors]
background     = #282c34
foreground     = #abb2bf
primary_blue   = #61afef
active_green   = #98c379
warn_yellow    = #e5c07b
alert_red      = #e06c75
dark_gray      = #3e4452
light_gray     = #5c6370

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
; 稍微加高一点栏高，完美容纳大字体
height = 35pt
radius = 0.0

background = ${colors.background}
foreground = ${colors.foreground}
line-size = 3pt
padding-left = 1
padding-right = 1
module-margin = 1

; === 字体加大版 ===
font-0 = "sans-serif:size=16:weight=regular;2"
font-1 = "JetBrainsMono Nerd Font:size=14;2"

; 模块序列：右侧加入了 cpu-temp、gpu-temp 和 tray
modules-left = rofi-window i3
modules-center = date
modules-right = network pulseaudio backlight cpu-temp gpu-temp battery tray

cursor-click = pointer
enable-ipc = true
enable-struts = true

; 全条盲滚切换工作区
scroll-up = "#i3.prev"
scroll-down = "#i3.next"

; ====================================================================
; 核心模块配置
; ====================================================================

[module/rofi-window]
type = custom/text
format = " 󰕰 "
format-foreground = ${colors.primary_blue}
click-left = rofi -show window

[module/i3]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = true
index-sort = true
enable-click = true
enable-scroll = false

format = <label-state> <label-mode>

; --- 模式提示（如 resize 状态） ---
label-mode = %mode%
label-mode-padding = 2
label-mode-background = #e06c75
label-mode-foreground = #ffffff

; --- 核心：当前聚焦的工作区（穿上坚实的 One Dark 蓝底大方块） ---
label-focused = "%index%"
label-focused-background = #8061afef   
label-focused-foreground = #ffffff
; label-focused-underline = #61afef  
label-focused-padding = 2           

; --- 未聚焦的工作区（老老实实当一片绿叶） ---
; 💡 彻底拿掉背景色！让它们直接融入状态栏的大背景中
label-unfocused = "%index%"
label-unfocused-foreground = #abb2bf 
label-unfocused-padding = 2         

; --- 在多显示器处于可见状态的工作区 ---
label-visible = "%index%"
label-visible-foreground = #5c6370 
label-visible-padding = 2

; --- 有紧急通知的工作区（大红底白字，疯狂报警） ---
label-urgent = "%index%"
label-urgent-background = #e06c75
label-urgent-foreground = #ffffff
label-urgent-padding = 2

; --- 用一个温和的空格在方块之间做天然隔离 ---
label-separator = " "

; === 新增：CPU 温度模块 ===
[module/cpu-temp]
type = internal/temperature
thermal-zone = 9
warn-temperature = 80

format = <label>
format-prefix = "CPU"
format-prefix-foreground = #61afef
format-prefix-padding-right = 2px
label = " %temperature-c%"

format-warn = <label-warn>
format-warn-prefix = "HOT"
format-warn-prefix-foreground = ${colors.alert_red}
label-warn = " %temperature-c%"
label-warn-foreground = ${colors.alert_red}

; === 新增：NVIDIA GPU 温度模块 ===
[module/gpu-temp]
type = custom/script
; 独显直连/混合模式下调用 nvidia-smi 工具读取独显核心温度
exec = nvidia-smi --query-gpu=temperature.gpu --format=csv,noheader,nounits 2>/dev/null || echo "OFF"
interval = 5
format-prefix = "GPU"
format-prefix-foreground = ${colors.active_green}
format-prefix-padding-right = 2px
label = " %output%°C"

; === 已修复的音量模块 ===
[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false

; 彻底移除了导致崩溃的 <shadow> 标签
format-volume = <label-volume>
format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.primary_blue}
format-prefix-padding-right = 6px
label-volume = " %percentage%%"

format-muted = <label-muted>
format-muted-prefix = "VOL "
format-muted-prefix-foreground = ${colors.light_gray}
label-muted = " Muted"

; === 其他常规模块保持正常 ===
[module/date]
type = internal/date
interval = 1
date = %Y-%m-%d %H:%M:%S
label = %date%
label-foreground = ${colors.foreground}

[module/network]
type = internal/network
interface = wlp0s20f3
interface-type = wireless
interval = 3
format-connected = <label-connected>
format-connected-prefix = "WIFI"
format-connected-prefix-foreground = ${colors.active_green}
format-prefix-padding-right = 6px
label-connected = " %essid% "
format-disconnected = <label-disconnected>
format-disconnected-prefix = "DISCONNECTED"
format-disconnected-prefix-foreground = ${colors.alert_red}
label-disconnected = " Disconnected"

[module/backlight]
type = internal/backlight
card = nvidia_0
enable-scroll = true
format = <label>
format-prefix = "LIGHT"
format-prefix-foreground = ${colors.warn_yellow}
format-prefix-padding-right = 6px
label = " %percentage%%"

[module/battery]
type = internal/battery
full-at = 99
low-at = 15
battery = BAT0
adapter = AC
poll-interval = 5

format-charging = <label-charging>
format-charging-prefix = "CHR "
format-charging-prefix-foreground = ${colors.active_green}
label-charging = "%percentage%%"

format-discharging = <label-discharging>
format-discharging-prefix = "BAT "
format-discharging-prefix-foreground = ${colors.warn_yellow}
label-discharging = "%percentage%%"

format-full = <label-full>
format-full-prefix = "FULL "
format-full-prefix-foreground = ${colors.active_green}
label-full = "%percentage%%"

format-low = <label-low>
format-low-prefix = "LOW "
format-low-prefix-foreground = ${colors.alert_red}
label-low = "%percentage%%"

; === 系统托盘 (终极优化垂直居中版) ===
[module/tray]
type = internal/tray
tray-background = ${colors.background}

; 💡 核心优化 1：放弃硬编码 px，改用百分比！
; 填入百分比时，Polybar 会自动根据你 35pt 的栏高进行等比例缩放。
; 60% ~ 65% 是黄金视觉比例，不仅图标变大变清晰，最重要的是：它会触发原生的垂直居中算法！
tray-size = 65%

; 💡 核心优化 2：拉开图标间距
; 既然图标变大了，间距从 8px 稍微提灯到 12px，让任务栏图标之间有呼吸感，不拥挤
tray-spacing = 12px

; 💡 核心优化 3：规范外围边界
; 因为新版 tray 是个标准模块，直接加 format-padding 
; 可以让整个托盘模块和左边的 [battery] 模块以及右边的屏幕边缘保持完美的视觉对齐，不会贴死
format-padding = 1

[settings]
screenchange-reload = true
pseudo-transparency = true

# =============================================================================
# i3wm One Dark 主题配置 (已清洗非法空格)
# =============================================================================

set $one_dark_bg      #282c34
set $one_dark_fg      #abb2bf
set $one_dark_comment #5c6370
set $one_dark_select  #3e4452

set $one_dark_red     #e06c75
set $one_dark_orange  #d19a66
set $one_dark_yellow  #e5c07b
set $one_dark_green   #98c379
set $one_dark_cyan    #56b6c2
set $one_dark_blue    #61afef
set $one_dark_purple  #c678dd

# --- 窗口颜色设置 ---
client.focused          $one_dark_blue    $one_dark_select  $one_dark_fg      $one_dark_blue    $one_dark_blue
client.focused_inactive $one_dark_comment $one_dark_bg      $one_dark_comment $one_dark_comment $one_dark_comment
client.unfocused        $one_dark_bg      $one_dark_bg      $one_dark_comment $one_dark_bg      $one_dark_bg
client.urgent           $one_dark_red     $one_dark_red     $one_dark_fg      $one_dark_red     $one_dark_red
client.placeholder      $one_dark_bg      $one_dark_bg      $one_dark_fg      $one_dark_bg      $one_dark_bg
client.background       $one_dark_bg

# --- i3bar 状态栏配置 (已更改为默认通用的 i3status) ---
bar {
    # 指定刚才写好的配置文件
    status_command i3blocks -c ~/.config/i3blocks/config
    
    # 状态栏位置（可以选 top 或 bottom）
    position top
    tray_padding 4
    font pango: Adwaita Mono 11
    colors {
        # 状态栏背景色 (One-Dark 深灰)
        background #282c34
        # 默认文本颜色
        statusline #abb2bf
        # 分隔符颜色
        separator  #5c6370
        
        # 工作区标签颜色格式：      边框    背景    文字
        focused_workspace  #61afef #3e4452 #61afef
        active_workspace   #3e4452 #282c34 #abb2bf
        inactive_workspace #282c34 #282c34 #5c6370
        urgent_workspace   #e06c75 #e06c75 #282c34
    }
}

# --- 强制恢复全局标题栏显示 ---
default_border normal 1
default_floating_border normal 1
hide_edge_borders none
title_align center
